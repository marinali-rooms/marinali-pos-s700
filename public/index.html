<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marinali Rooms POS</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; color: #1a1a1a; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #111827; color: white; padding: 16px; text-align: center; font-weight: bold; letter-spacing: 1px; font-size: 1.2rem; }
    
    .nav-tabs { display: flex; background: #e5e7eb; border-bottom: 1px solid #ccc; }
    .tab-btn { flex: 1; padding: 14px; border: none; background: none; font-weight: bold; cursor: pointer; color: #4b5563; font-size: 0.95rem; }
    .tab-btn.active { background: white; color: #111827; border-bottom: 4px solid #059669; }

    .container { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; }

    /* Griglia POS con grandi pulsanti touch (senza cifre visibili al pubblico) */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; margin: 0 auto; }
    .suite-card { background: white; border: 3px solid #d1d5db; border-radius: 16px; padding: 35px 15px; text-align: center; cursor: pointer; user-select: none; transition: all 0.15s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .suite-card:active { transform: scale(0.96); border-color: #059669; background-color: #ecfdf5; }
    .suite-name { font-size: 1.6rem; font-weight: 800; color: #1f2937; }

    /* Pannello Admin */
    .admin-panel { max-width: 440px; margin: 0 auto; width: 100%; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    select, input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
    .btn-submit { width: 100%; padding: 15px; background: #059669; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-submit:active { background: #047857; }
    .btn-clear { width: 100%; padding: 13px; background: #dc2626; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-clear:active { background: #b91c1c; }

    /* Lista Stato Addebiti in Admin */
    .status-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .status-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px border-dash #e5e7eb; font-size: 0.95rem; }
    .status-item:last-child { border-bottom: none; }
    .badge-active { background: #d1fae5; color: #065f46; font-weight: bold; padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; }
    .badge-empty { background: #f3f4f6; color: #9ca3af; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }

    #status-msg { text-align: center; margin-top: 24px; font-weight: bold; font-size: 1.15rem; min-height: 30px; }
  </style>
</head>
<body>

  <header>MARINALI ROOMS</header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('pos')">POS DISPLAY</button>
    <button class="tab-btn" onclick="switchTab('admin')">ADMIN (IMPOSTA)</button>
  </div>

  <!-- VISTA POS CLIENTE -->
  <div id="pos-view" class="container" style="justify-content: center;">
    <h2 style="text-align: center; margin-bottom: 24px; font-size: 1.1rem; color: #4b5563;">Tocca la tua Suite per saldare:</h2>
    <div class="grid" id="suites-grid"></div>
    <div id="status-msg"></div>
  </div>

  <!-- VISTA ADMIN -->
  <div id="admin-view" class="container" style="display: none;">
    <div class="admin-panel">
      
      <!-- Stato Addebiti Attivi -->
      <div class="status-box">
        <div class="status-title">Addebiti Attualmente Attivi:</div>
        <div id="admin-active-list">Caricamento...</div>
      </div>

      <h3 style="margin-bottom: 16px; color: #111827; font-size: 1.1rem;">Gestisci Addebito</h3>
      
      <div class="form-group">
        <label for="admin-suite">Seleziona Suite:</label>
        <select id="admin-suite">
          <option value="1">Suite 1</option>
          <option value="2">Suite 2</option>
          <option value="3">Suite 3</option>
          <option value="4">Suite 4</option>
        </select>
      </div>

      <div class="form-group">
        <label for="admin-amount">Importo (€):</label>
        <input type="number" id="admin-amount" step="0.01" placeholder="es. 140.00">
      </div>

      <div class="form-group">
        <label for="admin-days">Validità Addebito (Giorni):</label>
        <select id="admin-days">
          <option value="1" selected>1 Giorno (Default)</option>
          <option value="2">2 Giorni</option>
          <option value="3">3 Giorni</option>
          <option value="4">4 Giorni</option>
          <option value="5">5 Giorni</option>
          <option value="6">6 Giorni</option>
          <option value="7">7 Giorni</option>
          <option value="8">8 Giorni</option>
          <option value="9">9 Giorni</option>
        </select>
      </div>

      <button class="btn-submit" onclick="setSuiteAmount()">Salva Addebito</button>
      <button class="btn-clear" onclick="clearSuiteAmount()">Annulla Addebito (Contanti / Reset)</button>
    </div>
  </div>

  <script>
    let currentSuites = {};

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'pos') {
        document.getElementById('pos-view').style.display = 'flex';
        document.getElementById('admin-view').style.display = 'none';
        event.target.classList.add('active');
        fetchSuites();
      } else {
        document.getElementById('pos-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'flex';
        event.target.classList.add('active');
        fetchSuites();
      }
    }

    async function fetchSuites() {
      try {
        const res = await fetch('/api/suites');
        currentSuites = await res.json();
        renderGrid();
        renderAdminStatus();
      } catch (err) {
        console.error("Errore sincronizzazione dati:", err);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('suites-grid');
      grid.innerHTML = '';

      Object.keys(currentSuites).forEach(id => {
        const suite = currentSuites[id];
        const card = document.createElement('div');
        card.className = 'suite-card';
        card.onclick = () => startPayment(id);

        card.innerHTML = `<div class="suite-name">${suite.name}</div>`;
        grid.appendChild(card);
      });
    }

    function renderAdminStatus() {
      const listDiv = document.getElementById('admin-active-list');
      if (!listDiv) return;

      let html = '';
      Object.keys(currentSuites).forEach(id => {
        const suite = currentSuites[id];
        if (suite.amount > 0) {
          html += `
            <div class="status-item">
              <strong>${suite.name}</strong>
              <span class="badge-active">€${suite.amount.toFixed(2)}</span>
            </div>`;
        } else {
          html += `
            <div class="status-item">
              <span>${suite.name}</span>
              <span class="badge-empty">Nessun addebito</span>
            </div>`;
        }
      });
      listDiv.innerHTML = html;
    }

    async function startPayment(suiteId) {
      const suite = currentSuites[suiteId];
      const statusDiv = document.getElementById('status-msg');

      if (!suite || suite.amount <= 0) {
        statusDiv.style.color = '#dc2626';
        statusDiv.innerText = `Nessun conto attivo per ${suite.name}`;
        return;
      }

      statusDiv.style.color = '#059669';
      statusDiv.innerText = `Invio richiesta al lettore POS S700...`;

      try {
        const res = await fetch('/api/pos/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ suiteId })
        });
        const data = await res.json();

        if (data.success) {
          statusDiv.innerText = `Importo €${data.amount.toFixed(2)}: avvicina la carta al lettore POS.`;
        } else {
          statusDiv.style.color = '#dc2626';
          statusDiv.innerText = `Errore: ${data.error}`;
        }
      } catch (err) {
        statusDiv.style.color = '#dc2626';
        statusDiv.innerText = "Errore di connessione con il lettore.";
      }
    }

    async function setSuiteAmount() {
      const suiteId = document.getElementById('admin-suite').value;
      const amount = document.getElementById('admin-amount').value;
      const daysValid = document.getElementById('admin-days').value;

      const res = await fetch('/api/admin/set-amount', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suiteId, amount, daysValid })
      });
      const data = await res.json();

      if (data.success) {
        alert(`Addebito salvato per ${data.suiteName}: €${data.amount.toFixed(2)} (Valido per ${data.daysValid} giorni)`);
        document.getElementById('admin-amount').value = '';
        fetchSuites();
      }
    }

    async function clearSuiteAmount() {
      const suiteId = document.getElementById('admin-suite').value;

      const res = await fetch('/api/admin/clear-amount', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suiteId })
      });
      const data = await res.json();

      if (data.success) {
        alert(`Addebito per ${data.suiteName} annullato con successo.`);
        document.getElementById('admin-amount').value = '';
        fetchSuites();
      }
    }

    setInterval(fetchSuites, 3000);
    fetchSuites();
  </script>
</body>
</html>
