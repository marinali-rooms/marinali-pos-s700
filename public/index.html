<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marinali Rooms - Reception POS & Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Playfair Display (Luxury Serif) & Inter (Clean Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- React & Babel Frameworks -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdfbf7',
                            100: '#f7f2e8',
                            200: '#ece1cd',
                            300: '#dfcca8',
                            400: '#ceaf7a',
                            500: '#b89254',
                            600: '#9b7641',
                            700: '#7e5c36',
                            800: '#674a31',
                            900: '#543d2c',
                            950: '#2d1e15',
                        },
                        stone: {
                            850: '#211f1d',
                            950: '#0f0e0d'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Disable text selection for clean kiosk experience */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* Touch feedback animation */
        .active-scale {
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 font-sans antialiased min-h-screen overflow-x-hidden no-select">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Default initial suite configuration
        const INITIAL_SUITES = [
            { id: 1, name: 'SUITE 1', amount: 140.00, expiresAt: null, updatedAt: Date.now() },
            { id: 2, name: 'SUITE 2', amount: 0.00, expiresAt: null, updatedAt: Date.now() },
            { id: 3, name: 'SUITE 3', amount: 0.00, expiresAt: null, updatedAt: Date.now() },
            { id: 4, name: 'SUITE 4', amount: 0.00, expiresAt: null, updatedAt: Date.now() },
        ];

        // Real-time broadcast channel across browser tabs/devices
        const syncChannel = new BroadcastChannel('marinali_pos_sync');

        function App() {
            // Determine initial mode from URL parameter (?mode=admin or ?mode=kiosk)
            const [mode, setMode] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('mode') === 'admin' ? 'admin' : 'kiosk';
            });

            const [suites, setSuites] = useState(() => {
                const saved = localStorage.getItem('marinali_suites');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return INITIAL_SUITES;
            });

            // PIN Modal state for local Admin access
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);

            // Save and broadcast suite state updates
            const updateSuitesState = (newSuites) => {
                setSuites(newSuites);
                localStorage.setItem('marinali_suites', JSON.stringify(newSuites));
                syncChannel.postMessage({ type: 'SUITES_UPDATED', payload: newSuites });
            };

            // Sync state across channels & handle automatic expiration timers
            useEffect(() => {
                const handleSyncMessage = (event) => {
                    if (event.data && event.data.type === 'SUITES_UPDATED') {
                        setSuites(event.data.payload);
                    }
                };
                syncChannel.addEventListener('message', handleSyncMessage);

                // Check expired balances every 10 seconds
                const interval = setInterval(() => {
                    const now = Date.now();
                    let updated = false;
                    const checkedSuites = suites.map(suite => {
                        if (suite.expiresAt && now > suite.expiresAt && suite.amount > 0) {
                            updated = true;
                            return { ...suite, amount: 0, expiresAt: null, updatedAt: now };
                        }
                        return suite;
                    });
                    if (updated) {
                        updateSuitesState(checkedSuites);
                    }
                }, 10000);

                return () => {
                    syncChannel.removeEventListener('message', handleSyncMessage);
                    clearInterval(interval);
                };
            }, [suites]);

            // Switch between Guest Kiosk and Manager Admin view
            const toggleMode = (targetMode) => {
                if (targetMode === 'admin' && mode !== 'admin') {
                    setShowPinModal(true);
                } else {
                    setMode('kiosk');
                    window.history.pushState({}, '', window.location.pathname);
                }
            };

            const verifyPin = (e) => {
                e.preventDefault();
                // Default manager PIN: 1234
                if (pinInput === '1234') {
                    setMode('admin');
                    setShowPinModal(false);
                    setPinInput('');
                    setPinError(false);
                    window.history.pushState({}, '', '?mode=admin');
                } else {
                    setPinError(true);
                    setPinInput('');
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between max-w-md mx-auto bg-stone-950 border-x border-stone-850 shadow-2xl relative">
                    {/* Header with Official Logo & Branding */}
                    <header className="px-6 pt-6 pb-4 flex justify-between items-center border-b border-stone-850/80 bg-stone-950/90 backdrop-blur sticky top-0 z-30">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-stone-900 border border-brand-500/40 p-1 flex items-center justify-center shadow-md overflow-hidden">
                                <img 
                                    src="https://www.marinalirooms.it/logo.png" 
                                    alt="Marinali Rooms Logo" 
                                    className="w-full h-full object-contain"
                                    onError={(e) => {
                                        // Fallback monogram if image fails to load
                                        e.target.onerror = null; 
                                        e.target.parentElement.innerHTML = '<span class="font-serif text-brand-300 font-bold text-lg">M</span>';
                                    }}
                                />
                            </div>
                            <div>
                                <h1 className="font-serif text-lg tracking-wider text-brand-200 font-semibold leading-none">
                                    MARINALI ROOMS
                                </h1>
                                <span className="text-[9px] uppercase tracking-[0.2em] text-stone-400 font-medium block mt-0.5">
                                    Historic Center • Bassano del Grappa
                                </span>
                            </div>
                        </div>

                        {/* Mode Switcher Button (Gestore / Kiosk View) */}
                        <button 
                            onClick={() => toggleMode(mode === 'kiosk' ? 'admin' : 'kiosk')}
                            className="px-3 py-1.5 rounded-full text-xs font-medium border border-stone-800 bg-stone-900 text-stone-300 hover:text-brand-300 hover:border-brand-500/50 transition-all flex items-center gap-1.5 active-scale"
                        >
                            {mode === 'kiosk' ? (
                                <>
                                    <i data-lucide="shield" className="w-3.5 h-3.5 text-brand-400"></i>
                                    <span>Gestore</span>
                                </>
                            ) : (
                                <>
                                    <i data-lucide="monitor" className="w-3.5 h-3.5 text-emerald-400"></i>
                                    <span>Kiosk View</span>
                                </>
                            )}
                        </button>
                    </header>

                    {/* Main Dynamic View */}
                    <main className="flex-1 flex flex-col p-5 relative">
                        {mode === 'kiosk' ? (
                            <KioskView suites={suites} updateSuitesState={updateSuitesState} />
                        ) : (
                            <AdminView suites={suites} updateSuitesState={updateSuitesState} />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="p-4 text-center text-stone-600 text-[11px] border-t border-stone-900 bg-stone-950">
                        Marinali Rooms • Self-Service Checkout System
                    </footer>

                    {/* Manager PIN Protection Modal */}
                    {showPinModal && (
                        <div className="absolute inset-0 bg-stone-950/95 backdrop-blur-md z-50 flex items-center justify-center p-6">
                            <div className="bg-stone-900 border border-stone-800 rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center">
                                <div className="w-12 h-12 bg-brand-500/10 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-400">
                                    <i data-lucide="lock" className="w-6 h-6"></i>
                                </div>
                                <h3 className="text-lg font-serif text-brand-200 mb-1">Manager Access</h3>
                                <p className="text-xs text-stone-400 mb-5">Enter security PIN to access cassa settings.</p>
                                
                                <form onSubmit={verifyPin} className="space-y-4">
                                    <input 
                                        type="password"
                                        maxLength="4"
                                        pattern="[0-9]*"
                                        inputMode="numeric"
                                        value={pinInput}
                                        onChange={(e) => setPinInput(e.target.value)}
                                        placeholder="••••"
                                        className={`w-full text-center text-2xl tracking-[0.5em] font-mono py-3 rounded-xl bg-stone-950 border ${pinError ? 'border-red-500' : 'border-stone-700'} text-stone-100 focus:outline-none focus:border-brand-400`}
                                        autoFocus
                                    />
                                    {pinError && <p className="text-xs text-red-400">Incorrect PIN. Try again.</p>}
                                    
                                    <div className="flex gap-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPinModal(false)}
                                            className="flex-1 py-2.5 rounded-xl border border-stone-700 text-stone-300 text-xs font-medium hover:bg-stone-800"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2.5 rounded-xl bg-brand-500 text-stone-950 font-bold text-xs hover:bg-brand-400"
                                        >
                                            Confirm
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // GUEST KIOSK VIEW (100% INTERNATIONAL ENGLISH)
        // ==========================================
        function KioskView({ suites, updateSuitesState }) {
            const [selectedSuite, setSelectedSuite] = useState(null);
            const [paymentState, setPaymentState] = useState('IDLE'); // IDLE, CONFIRM, PROCESSING, SUCCESS

            useEffect(() => {
                lucide.createIcons();
            }, [selectedSuite, paymentState]);

            // Handle selecting a suite from main menu
            const handleSuiteSelect = (suite) => {
                setSelectedSuite(suite);
                setPaymentState('CONFIRM');
            };

            // Reset back to initial 4 suite buttons
            const handleCancel = () => {
                setSelectedSuite(null);
                setPaymentState('IDLE');
            };

            // Trigger Stripe Reader S700 Payment flow
            const handlePayNow = () => {
                setPaymentState('PROCESSING');

                // Simulate cloud connection to Stripe Terminal S700
                setTimeout(() => {
                    setPaymentState('SUCCESS');

                    // Clear room balance automatically upon payment completion
                    const updatedSuites = suites.map(s => 
                        s.id === selectedSuite.id 
                            ? { ...s, amount: 0.00, expiresAt: null, updatedAt: Date.now() } 
                            : s
                    );
                    updateSuitesState(updatedSuites);

                    // Reset back to initial kiosk menu after 4 seconds
                    setTimeout(() => {
                        setSelectedSuite(null);
                        setPaymentState('IDLE');
                    }, 4000);

                }, 2800);
            };

            return (
                <div className="flex-1 flex flex-col justify-center my-auto">
                    {/* VIEW 1: Initial 4 Suite Buttons (NO PRICES SHOWN) */}
                    {paymentState === 'IDLE' && (
                        <div className="space-y-6 animate-fade-in">
                            <div className="text-center space-y-1 mb-2">
                                <h2 className="text-2xl font-serif text-brand-100 tracking-wide">Welcome</h2>
                                <p className="text-xs text-stone-400">Please select your suite to complete payment</p>
                            </div>

                            <div className="grid grid-cols-1 gap-4">
                                {suites.map((suite) => (
                                    <button
                                        key={suite.id}
                                        onClick={() => handleSuiteSelect(suite)}
                                        className="w-full p-6 rounded-2xl border border-stone-800 bg-gradient-to-br from-stone-900 via-stone-900/90 to-stone-950 text-left flex items-center justify-between active-scale transition-all duration-200 hover:border-brand-500/50 shadow-lg shadow-black/40 group"
                                    >
                                        <div className="flex items-center space-x-4">
                                            <div className="w-14 h-14 rounded-2xl bg-brand-500/10 border border-brand-500/30 flex items-center justify-center font-serif text-xl font-bold text-brand-300 group-hover:scale-105 transition-transform">
                                                0{suite.id}
                                            </div>
                                            <div>
                                                <h3 className="font-serif text-xl text-stone-100 font-semibold tracking-wide group-hover:text-brand-200 transition-colors">
                                                    {suite.name}
                                                </h3>
                                                <span className="text-[11px] text-stone-400 block mt-0.5">
                                                    Tap to view total balance
                                                </span>
                                            </div>
                                        </div>

                                        <div className="w-9 h-9 rounded-full bg-stone-850 flex items-center justify-center text-stone-400 group-hover:text-brand-300 group-hover:bg-stone-800 transition-all">
                                            <i data-lucide="chevron-right" className="w-5 h-5"></i>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* VIEW 2: Confirmation Screen (Amount Displayed + CANCEL / PAY NOW) */}
                    {(paymentState === 'CONFIRM' || paymentState === 'PROCESSING' || paymentState === 'SUCCESS') && selectedSuite && (
                        <div className="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-2xl text-center space-y-6 animate-fade-in relative overflow-hidden">

                            {/* State 1: Summary & Price Display */}
                            {paymentState === 'CONFIRM' && (
                                <>
                                    <div className="space-y-1">
                                        <span className="text-[11px] uppercase tracking-widest text-brand-400 font-semibold">Payment Summary</span>
                                        <h2 className="text-2xl font-serif text-stone-100">{selectedSuite.name}</h2>
                                    </div>

                                    <div className="py-6 px-4 bg-stone-950/80 rounded-2xl border border-stone-850 my-4">
                                        <span className="text-xs text-stone-400 block mb-1">Total Amount Due</span>
                                        <div className="text-4xl font-bold font-sans text-brand-300 tracking-tight">
                                            € {selectedSuite.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                        </div>
                                        {selectedSuite.amount === 0 && (
                                            <p className="text-xs text-amber-400/90 mt-2">No pending balance for this room.</p>
                                        )}
                                    </div>

                                    <div className="flex flex-col gap-3 pt-2">
                                        <button
                                            onClick={handlePayNow}
                                            disabled={selectedSuite.amount === 0}
                                            className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide shadow-xl flex items-center justify-center gap-2.5 active-scale transition-all ${
                                                selectedSuite.amount > 0
                                                    ? 'bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-stone-950 shadow-brand-500/20'
                                                    : 'bg-stone-800 text-stone-500 cursor-not-allowed'
                                            }`}
                                        >
                                            <i data-lucide="credit-card" className="w-5 h-5"></i>
                                            <span>OK / PAY NOW</span>
                                        </button>

                                        <button
                                            onClick={handleCancel}
                                            className="w-full py-3.5 rounded-2xl border border-stone-750 text-stone-300 text-xs font-semibold hover:bg-stone-800/80 active-scale flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                            <span>CANCEL / BACK</span>
                                        </button>
                                    </div>
                                </>
                            )}

                            {/* State 2: Triggering Stripe S700 Terminal */}
                            {paymentState === 'PROCESSING' && (
                                <div className="py-8 space-y-6">
                                    <div className="relative w-20 h-20 mx-auto flex items-center justify-center">
                                        <div className="absolute inset-0 rounded-full border-4 border-brand-500/20 border-t-brand-400 animate-spin"></div>
                                        <i data-lucide="wifi" className="w-8 h-8 text-brand-300 animate-pulse"></i>
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <h3 className="text-xl font-serif text-brand-200">Payment Reader Active</h3>
                                        <p className="text-sm text-stone-300">Please tap or insert your card on the Stripe Reader next to you.</p>
                                    </div>

                                    <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-stone-950 border border-stone-800 text-[11px] text-stone-400">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                        Waiting for guest card tap...
                                    </div>
                                </div>
                            )}

                            {/* State 3: Payment Success */}
                            {paymentState === 'SUCCESS' && (
                                <div className="py-8 space-y-5 animate-fade-in">
                                    <div className="w-20 h-20 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mx-auto text-emerald-400">
                                        <i data-lucide="check-circle-2" className="w-10 h-10"></i>
                                    </div>

                                    <div className="space-y-1">
                                        <h3 className="text-2xl font-serif text-emerald-300">Payment Successful!</h3>
                                        <p className="text-xs text-stone-300">Transaction approved for {selectedSuite.name}.</p>
                                    </div>

                                    <div className="p-4 bg-stone-950/80 rounded-xl border border-stone-850 text-xs text-stone-400">
                                        Thank you for your stay at Marinali Rooms!
                                    </div>
                                </div>
                            )}

                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // MANAGER ADMIN VIEW
        // ==========================================
        function AdminView({ suites, updateSuitesState }) {
            const [selectedId, setSelectedId] = useState(1);
            const [amountInput, setAmountInput] = useState('');
            const [expireDays, setExpireDays] = useState('2');
            const [notification, setNotification] = useState('');

            const currentSuite = suites.find(s => s.id === selectedId);

            useEffect(() => {
                if (currentSuite) {
                    setAmountInput(currentSuite.amount > 0 ? currentSuite.amount.toString() : '');
                }
                lucide.createIcons();
            }, [selectedId, suites]);

            const showNotify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const handleSaveSuite = (e) => {
                e.preventDefault();
                const numericAmount = parseFloat(amountInput.replace(',', '.')) || 0;
                const days = parseInt(expireDays) || 0;
                const expiresAt = days > 0 ? Date.now() + (days * 24 * 60 * 60 * 1000) : null;

                const updated = suites.map(s => 
                    s.id === selectedId 
                        ? { ...s, amount: numericAmount, expiresAt: expiresAt, updatedAt: Date.now() } 
                        : s
                );

                updateSuitesState(updated);
                showNotify(`Updated ${currentSuite.name} balance to € ${numericAmount.toFixed(2)}`);
            };

            const handleResetSuite = (id) => {
                const updated = suites.map(s => 
                    s.id === id 
                        ? { ...s, amount: 0.00, expiresAt: null, updatedAt: Date.now() } 
                        : s
                );
                updateSuitesState(updated);
                showNotify(`Cleared room balance.`);
            };

            return (
                <div className="flex-1 flex flex-col space-y-5">
                    {/* Admin Header */}
                    <div className="flex justify-between items-center bg-stone-900/60 p-4 rounded-2xl border border-stone-850">
                        <div>
                            <h2 className="text-base font-serif text-brand-200 font-medium">Gestore Cassa Panel</h2>
                            <p className="text-[11px] text-stone-400">Set amounts for reception checkout</p>
                        </div>
                        <div className="px-2.5 py-1 rounded-md bg-stone-950 text-[10px] text-brand-400 border border-stone-800 font-mono">
                            ADMIN MODE
                        </div>
                    </div>

                    {notification && (
                        <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-300 text-xs text-center animate-fade-in flex items-center justify-center gap-2">
                            <i data-lucide="check" className="w-4 h-4"></i>
                            <span>{notification}</span>
                        </div>
                    )}

                    {/* Suite Selector */}
                    <div className="space-y-2">
                        <label className="text-xs text-stone-400 font-medium uppercase tracking-wider block">1. Select Suite</label>
                        <div className="grid grid-cols-4 gap-2">
                            {suites.map(s => (
                                <button
                                    key={s.id}
                                    type="button"
                                    onClick={() => setSelectedId(s.id)}
                                    className={`py-3 rounded-xl border text-center transition-all ${
                                        selectedId === s.id 
                                            ? 'bg-brand-500 text-stone-950 font-bold border-brand-400 shadow-md shadow-brand-500/20' 
                                            : 'bg-stone-900 border-stone-800 text-stone-300 hover:border-stone-700'
                                    }`}
                                >
                                    <div className="text-xs font-serif">SUITE</div>
                                    <div className="text-lg font-bold leading-none">0{s.id}</div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Pricing Form */}
                    <form onSubmit={handleSaveSuite} className="bg-stone-900 border border-stone-800 rounded-2xl p-5 space-y-4">
                        <div className="flex justify-between items-center pb-3 border-b border-stone-800">
                            <span className="font-serif text-lg text-stone-100">{currentSuite.name}</span>
                            <span className="text-xs text-stone-400">
                                Current Balance: <strong className="text-brand-300">€ {currentSuite.amount.toFixed(2)}</strong>
                            </span>
                        </div>

                        <div className="space-y-1.5">
                            <label className="text-xs text-stone-400 font-medium">Charge Amount (€)</label>
                            <div className="relative">
                                <input
                                    type="number"
                                    step="0.01"
                                    placeholder="0.00"
                                    value={amountInput}
                                    onChange={(e) => setAmountInput(e.target.value)}
                                    className="w-full bg-stone-950 border border-stone-750 rounded-xl py-3 px-4 text-xl font-semibold text-brand-200 focus:outline-none focus:border-brand-400"
                                    required
                                />
                                <span className="absolute right-4 top-3.5 text-stone-500 font-bold">€</span>
                            </div>
                        </div>

                        <div className="space-y-1.5">
                            <label className="text-xs text-stone-400 font-medium">Active Duration (Expiration Timer)</label>
                            <select
                                value={expireDays}
                                onChange={(e) => setExpireDays(e.target.value)}
                                className="w-full bg-stone-950 border border-stone-750 rounded-xl py-3 px-4 text-sm text-stone-200 focus:outline-none focus:border-brand-400"
                            >
                                <option value="1">1 Day (Expires tomorrow)</option>
                                <option value="2">2 Days (Standard Check-in)</option>
                                <option value="3">3 Days</option>
                                <option value="7">7 Days</option>
                                <option value="0">No expiration (Fixed)</option>
                            </select>
                        </div>

                        <div className="pt-2 flex gap-2">
                            <button
                                type="submit"
                                className="flex-1 py-3.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-stone-950 font-bold text-sm shadow-lg shadow-brand-500/15 flex items-center justify-center gap-2"
                            >
                                <i data-lucide="save" className="w-4 h-4"></i>
                                <span>Save Room Balance</span>
                            </button>
                        </div>
                    </form>

                    {/* Suite Status Summary */}
                    <div className="space-y-2 pt-2">
                        <label className="text-xs text-stone-400 font-medium uppercase tracking-wider block">Suites Status</label>
                        <div className="space-y-2">
                            {suites.map(s => (
                                <div key={s.id} className="p-3 bg-stone-900/40 border border-stone-850 rounded-xl flex items-center justify-between text-xs">
                                    <div className="flex items-center gap-2">
                                        <span className="font-serif font-bold text-stone-300">{s.name}</span>
                                        <span className={`px-2 py-0.5 rounded text-[10px] ${s.amount > 0 ? 'bg-brand-500/20 text-brand-300' : 'bg-stone-800 text-stone-500'}`}>
                                            {s.amount > 0 ? `€ ${s.amount.toFixed(2)}` : 'Empty'}
                                        </span>
                                    </div>
                                    {s.amount > 0 && (
                                        <button
                                            type="button"
                                            onClick={() => handleResetSuite(s.id)}
                                            className="px-2.5 py-1 rounded bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-medium text-[10px] flex items-center gap-1"
                                        >
                                            <i data-lucide="trash-2" className="w-3 h-3"></i>
                                            Clear
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
