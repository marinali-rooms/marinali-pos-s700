<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marinali Rooms POS</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; color: #1a1a1a; display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: #111827; color: white; padding: 16px; text-align: center; font-weight: bold; letter-spacing: 1px; font-size: 1.2rem; }
    
    .nav-tabs { display: flex; background: #e5e7eb; border-bottom: 1px solid #ccc; }
    .tab-btn { flex: 1; padding: 14px; border: none; background: none; font-weight: bold; cursor: pointer; color: #4b5563; font-size: 0.95rem; }
    .tab-btn.active { background: white; color: #111827; border-bottom: 4px solid #059669; }

    .container { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* Griglia POS con grandi pulsanti touch per il cliente */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 480px; margin: 0 auto; }
    .suite-card { background: white; border: 3px solid #d1d5db; border-radius: 16px; padding: 25px 15px; text-align: center; cursor: pointer; user-select: none; transition: all 0.15s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .suite-card:active { transform: scale(0.96); border-color: #059669; background-color: #ecfdf5; }
    .suite-name { font-size: 1.4rem; font-weight: 800; color: #1f2937; margin-bottom: 6px; }
    .suite-amount { font-size: 1.5rem; font-weight: 900; color: #059669; }
    .suite-amount.empty { color: #9ca3af; font-size: 0.95rem; font-weight: 500; }
    .suite-expire { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }

    /* Pannello Admin */
    .admin-panel { max-width: 420px; margin: 0 auto; width: 100%; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    select, input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
    .btn-submit { width: 100%; padding: 15px; background: #059669; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .btn-submit:active { background: #047857; }

    #status-msg { text-align: center; margin-top: 20px; font-weight: bold; font-size: 1.15rem; min-height: 30px; }
  </style>
</head>
<body>

  <header>MARINALI ROOMS</header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('pos')">POS DISPLAY</button>
    <button class="tab-btn" onclick="switchTab('admin')">ADMIN (IMPOSTA)</button>
  </div>

  <!-- VISTA POS CLIENTE -->
  <div id="pos-view" class="container">
    <h2 style="text-align: center; margin-bottom: 24px; font-size: 1.1rem; color: #4b5563;">Tocca la tua Suite per procedere al pagamento:</h2>
    <div class="grid" id="suites-grid"></div>
    <div id="status-msg"></div>
  </div>

  <!-- VISTA ADMIN -->
  <div id="admin-view" class="container" style="display: none;">
    <div class="admin-panel">
      <h3 style="margin-bottom: 18px; color: #111827;">Imposta Addebito Suite</h3>
      
      <div class="form-group">
        <label for="admin-suite">Seleziona Suite:</label>
        <select id="admin-suite">
          <option value="1">Suite 1</option>
          <option value="2">Suite 2</option>
          <option value="3">Suite 3</option>
          <option value="4">Suite 4</option>
        </select>
      </div>

      <div class="form-group">
        <label for="admin-amount">Importo (€):</label>
        <input type="number" id="admin-amount" step="0.01" placeholder="es. 140.00">
      </div>

      <div class="form-group">
        <label for="admin-days">Validità Addebito (TTL):</label>
        <select id="admin-days">
          <option value="1" selected>1 Giorno (Default)</option>
          <option value="2">2 Giorni</option>
          <option value="3">3 Giorni</option>
          <option value="7">7 Giorni</option>
        </select>
      </div>

      <button class="btn-submit" onclick="setSuiteAmount()">Salva Addebito</button>
    </div>
  </div>

  <script>
    let currentSuites = {};

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'pos') {
        document.getElementById('pos-view').style.display = 'flex';
        document.getElementById('admin-view').style.display = 'none';
        event.target.classList.add('active');
        fetchSuites();
      } else {
        document.getElementById('pos-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'flex';
        event.target.classList.add('active');
      }
    }

    async function fetchSuites() {
      try {
        const res = await fetch('/api/suites');
        currentSuites = await res.json();
        renderGrid();
      } catch (err) {
        console.error("Errore sincronizzazione dati:", err);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('suites-grid');
      grid.innerHTML = '';

      Object.keys(currentSuites).forEach(id => {
        const suite = currentSuites[id];
        const card = document.createElement('div');
        card.className = 'suite-card';
        card.onclick = () => startPayment(id);

        let expireText = '';
        if (suite.expiresAt && suite.amount > 0) {
          const expDate = new Date(suite.expiresAt);
          expireText = `<div class="suite-expire">Scade il ${expDate.toLocaleDateString('it-IT')} ore ${expDate.getHours()}:${String(expDate.getMinutes()).padStart(2, '0')}</div>`;
        }

        const amountHTML = suite.amount > 0 
          ? `<div class="suite-amount">€ ${suite.amount.toFixed(2)}</div>${expireText}` 
          : `<div class="suite-amount empty">Nessun conto</div>`;

        card.innerHTML = `
          <div class="suite-name">${suite.name}</div>
          ${amountHTML}
        `;
        grid.appendChild(card);
      });
    }

    async function startPayment(suiteId) {
      const suite = currentSuites[suiteId];
      const statusDiv = document.getElementById('status-msg');

      if (!suite || suite.amount <= 0) {
        statusDiv.style.color = '#dc2626';
        statusDiv.innerText = `Nessun conto attivo per ${suite.name}`;
        return;
      }

      statusDiv.style.color = '#059669';
      statusDiv.innerText = `Invio €${suite.amount.toFixed(2)} allo Stripe S700...`;

      try {
        const res = await fetch('/api/pos/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ suiteId })
        });
        const data = await res.json();

        if (data.success) {
          statusDiv.innerText = `Avvicina la carta al POS per saldare €${suite.amount.toFixed(2)}`;
        } else {
          statusDiv.style.color = '#dc2626';
          statusDiv.innerText = `Errore: ${data.error}`;
        }
      } catch (err) {
        statusDiv.style.color = '#dc2626';
        statusDiv.innerText = "Errore di connessione con il lettore.";
      }
    }

    async function setSuiteAmount() {
      const suiteId = document.getElementById('admin-suite').value;
      const amount = document.getElementById('admin-amount').value;
      const daysValid = document.getElementById('admin-days').value;

      const res = await fetch('/api/admin/set-amount', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suiteId, amount, daysValid })
      });
      const data = await res.json();

      if (data.success) {
        alert(`Addebito salvato per ${data.suite.name}: €${data.suite.amount.toFixed(2)} (Valido ${daysValid} gg)`);
        document.getElementById('admin-amount').value = '';
        fetchSuites();
      }
    }

    // Polling ogni 3 secondi per mantenere aggiornato lo schermo del POS
    setInterval(fetchSuites, 3000);
    fetchSuites();
  </script>
</body>
</html>
