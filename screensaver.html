<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Screensaver - Marinali Rooms</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .bg-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    /* Stile per le immagini */
    .bg-image {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease-in-out; /* Dissolvenza morbida */
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65);
      z-index: 2;
    }

    .content {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      animation: drift 30s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translate(-15px, -15px); }
      25% { transform: translate(15px, -10px); }
      50% { transform: translate(10px, 15px); }
      75% { transform: translate(-10px, 10px); }
      100% { transform: translate(0, 0); }
    }

    .tap-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .title {
      font-size: 3.5rem;
      font-weight: 900;
      color: #fbbf24;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }

    .languages {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lang-text {
  font-size: 2rem;            /* Ingrandito da 1.5rem */
  font-weight: 600;           /* Leggermente più marcato per migliorare la leggibilità */
  margin: 0;
  color: #cbd5e1;
  text-shadow: 0 3px 12px rgba(0,0,0,0.85); /* Ombra accentuata per dare stacco dallo sfondo */
  line-height: 1.3;
}
    
  </style>
</head>
<body>

  <div class="bg-container" id="bg-container"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="tap-icon">👆</div>
    <h1 class="title">Payment Terminal</h1>
    <div class="languages">
      <p class="lang-text">Terminale di Pagamento</p>
      <p class="lang-text">Payment Terminal</p>
      <p class="lang-text">Bezahlterminal</p>
    </div>
  </div>

  <script>
    // I nomi delle tue foto
    const myImages = [
      "foto1.jpg", "foto2.jpg", "foto3.jpg", "foto4.jpg", "foto5.jpg",
      "foto6.jpg", "foto7.jpg", "foto8.jpg", "foto9.jpg", "foto10.jpg",
      "foto11.jpg", "foto12.jpg", "foto13.jpg", "foto14.jpg", "foto15.jpg"
    ];

    const container = document.getElementById('bg-container');
    const imgElements = [];

    // Creiamo gli elementi immagine in base alla lista
    myImages.forEach((fileName) => {
      const img = document.createElement('img');
      img.className = 'bg-image';
      
      // ⚠️ ATTENZIONE: Qui c'è "Images" con la I maiuscola come nel tuo codice.
      // Se hai rinominato la cartella in minuscolo su GitHub, cambia in '/images/'
      img.src = '/Images/' + fileName; 
      
      container.appendChild(img);
      imgElements.push(img);
    });

    // Facciamo partire lo slideshow
    if (imgElements.length > 0) {
      let currentIndex = 0;
      
      // Mostra la prima foto
      imgElements[0].style.opacity = '1';

      // Cambia foto ogni 6 secondi (6000 millisecondi)
      setInterval(() => {
        imgElements[currentIndex].style.opacity = '0'; // Nascondi quella attuale
        currentIndex = (currentIndex + 1) % imgElements.length; // Passa alla successiva
        imgElements[currentIndex].style.opacity = '1'; // Mostra la nuova
      }, 6000);
    }
  </script>
</body>
</html>
