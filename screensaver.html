<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Screensaver - Marinali Rooms</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .bg-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65);
      z-index: 2;
    }

    .content {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      animation: drift 30s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translate(-15px, -15px); }
      25% { transform: translate(15px, -10px); }
      50% { transform: translate(10px, 15px); }
      75% { transform: translate(-10px, 10px); }
      100% { transform: translate(0, 0); }
    }

    .tap-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .title {
      font-size: 3.5rem;
      font-weight: 900;
      color: #fbbf24;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }

    .languages {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lang-text {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0;
      color: #cbd5e1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="bg-container" id="bg-container"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="tap-icon">👆</div>
    <h1 class="title">Tap to start</h1>
    <div class="languages">
      <p class="lang-text">Tocca per iniziare</p>
      <p class="lang-text">Tap to start</p>
      <p class="lang-text">Tippen Sie zum Starten</p>
    </div>
  </div>

  <script>
    // QUI INSERISCI I NOMI DELLE TUE FOTO
    // Basta mettere i nomi esatti dei file che hai caricato nella cartella images su GitHub
    const myImages = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg",
      "foto6.jpg",
      "foto7.jpg",
      "foto8.jpg",
      "foto9.jpg",
      "foto10.jpg",
      "foto11.jpg",
      "foto12.jpg",
      "foto13.jpg",
      "foto14.jpg",
      "foto15.jpg"
    ];

    function initSlideshow() {
      const container = document.getElementById('bg-container');
      
      if (myImages.length === 0) return;

      const totalDuration = 24; // Durata del ciclo in secondi
      const step = 100 / myImages.length; 
      const fadeTime = Math.min(step * 0.2, 10);

      // Genera l'animazione CSS in base a quante foto ci sono
      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes crossfade {
          0% { opacity: 0; }
          ${fadeTime}% { opacity: 1; }
          ${step - fadeTime}% { opacity: 1; }
          ${step}% { opacity: 0; }
          100% { opacity: 0; }
        }
        .bg-image {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background-size: cover;
          background-position: center;
          opacity: 0;
          animation: crossfade ${totalDuration}s infinite;
        }
      `;
      document.head.appendChild(style);

         // 2. Creiamo le immagini
    myImages.forEach((fileName) => {
      const img = document.createElement('img');
      img.className = 'bg-image';
      // QUI HO MESSO LA "I" MAIUSCOLA
      img.src = '/Images/' + fileName; 
      container.appendChild(img);
      imgElements.push(img);
    });

    initSlideshow();
  </script>
</body>
</html>
